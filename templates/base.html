<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>distrACT</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- MAIN CONTENT -->
    <main class="container pb-5">

        <!--Error Message-->
         {% with messages = get_flashed_messages() %}
          {% for m in messages %}
            <div class="alert alert-warning alert-dismissible fade show mt-3">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- NAVBAR -->
    <nav class="navbar fixed-bottom bg-dark navbar-dark">
        <div class="container">
            <div class="mx-auto d-flex align-items-center gap-2">
                {% if current_user.is_authenticated %}
                    <span class="text-light me-2">Hi, {{ current_user.username }}</span>
                    <a class="btn btn-outline-light" href="{{ url_for('auth.logout') }}">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light" href="{{ url_for('auth.login') }}">Login</a>
                    <a class="btn btn-primary" href="{{ url_for('auth.signup') }}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
