<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>distrACTIVE Dashboard</title>

   <!-- Bootstrap -->
   <link
       href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet"
   >

   <link
       rel="stylesheet"
       href="{{ url_for('static', filename='style.css') }}"
   >
</head>

<body>

<div class="container-fluid p-4">

   <h1 class="mb-4">distrACTIVE Dashboard</h1>

   <div class="row g-4">

       <!-- Widget 1: Activity -->
       <div class="col-md-6">
           <div class="card shadow-sm h-100">
               <div class="card-body">
                   <h3 class="card-title">Activity</h3>
                   <p class="text-muted">Your tasks will appear here.</p>

                   <!-- Add Task -->
                   <button class="btn btn-primary">+ Add Task</button>
               </div>
           </div>
       </div>

       <!-- Widget 2: Calendar -->
       <div class="col-md-6">
           <div class="card shadow-sm h-100">
               <div class="card-body">
                   <h3 class="card-title">Calendar</h3>
                   <p class="text-muted">View your upcoming events.</p>
               </div>
           </div>
       </div>

       <!-- Widget 3: Progress -->
       <div class="col-md-6">
           <div class="card shadow-sm h-100">
               <div class="card-body">
                   <h3 class="card-title">Progress</h3>
                   <p class="text-muted">Track your completed tasks.</p>

                   <!-- Progress bar placeholder -->
                   <div class="progress">
                       <div class="progress-bar" role="progressbar" style="width: 0%;">
                           0%
                       </div>
                   </div>
               </div>
           </div>
       </div>

       <!-- Widget 4: Settings -->
       <div class="col-md-6">
           <div class="card shadow-sm h-100">
               <div class="card-body">
                   <h3 class="card-title">Settings</h3>
                   <p class="text-muted">Manage your account and preferences.</p>

                   <div class="d-flex gap-2">
                       <a href="{{ url_for('settings') }}" class="btn btn-outline-secondary">Settings</a>
                       <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Log out</a>
                   </div>
               </div>
           </div>
       </div>

   </div>

</div>

</body>
</html>
