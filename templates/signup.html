{% extends "base.html" %}

{% block content %}
<style>
    .login {
        max-width: 400px;
        margin: 80px auto;
        padding: 35px;
        background: black;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }
    .login h1 {
        text-align: center;
        margin-bottom: 25px;
        color: white;
    }
    .login input {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
    }
    .login button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    .login p, .login a {
        color: white;
        text-align: center;
        margin-top: 15px;
    }
    .login .hint {
        color: #aaa;
        font-size: 0.85rem;
        margin-top: 5px;
    }
</style>

<div class="login">
    <h1>Sign up</h1>

    <form method="post">
        <input name="username" id="username" placeholder="Username" required>
        <input type="email" name="email" id="email" placeholder="Email" required>
        <input type="password" name="password" id="password" placeholder="Password" minlength="8" required>
        <div class="hint">At least 8 characters.</div>
        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
